[build]
  publish = "."

[context.development]
  publish = "."

[context.production]
  command = "node scripts/prepare-production.cjs"
  publish = "_site"

# Keep the existing launch-list database and emailed unsubscribe links available.
# The signup UI and private dashboard continue on their original Sites host.
[[redirects]]
  from = "/unsubscribe"
  to = "https://fashionrockstar-launch.zavyer.chatgpt.site/unsubscribe"
  status = 200
  force = true

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = true

[[redirects]]
  from = "/mailing-list"
  to = "https://fashionrockstar-launch.zavyer.chatgpt.site/"
  status = 302
  force = true

[[redirects]]
  from = "/list"
  to = "https://fashionrockstar-launch.zavyer.chatgpt.site/list"
  status = 302
  force = true

[[redirects]]
  from = "/book"
  to = "/booking/"
  status = 301
  force = true

[[redirects]]
  from = "/book/*"
  to = "/booking/"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/booking/"
  status = 301
  force = true

[[redirects]]
  from = "/contact/*"
  to = "/booking/"
  status = 301
  force = true

[[redirects]]
  from = "/inquiry"
  to = "/booking/"
  status = 301
  force = true

[[redirects]]
  from = "/inquiry/*"
  to = "/booking/"
  status = 301
  force = true
