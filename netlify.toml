[build]
  publish = "."

[context.development]
  publish = "."

[[redirects]]
  from = "/book"
  to = "/booking/"
  status = 301
  force = true

[[redirects]]
  from = "/book/*"
  to = "/booking/"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/booking/"
  status = 301
  force = true

[[redirects]]
  from = "/contact/*"
  to = "/booking/"
  status = 301
  force = true

[[redirects]]
  from = "/inquiry"
  to = "/booking/"
  status = 301
  force = true

[[redirects]]
  from = "/inquiry/*"
  to = "/booking/"
  status = 301
  force = true

# ABOUT is hidden while its original source remains recoverable.
[[redirects]]
  from = "/about"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/about/*"
  to = "/"
  status = 302
  force = true
