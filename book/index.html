<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Project inquiries — FASHIONROCKSTAR.ONLINE.">
  <title>PROJECT INQUIRIES — FASHIONROCKSTAR.ONLINE</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/booking.js" defer></script>
</head>
<body class="theme-dark">
  <header class="site-header">
    <a class="site-logo" href="/" aria-label="FASHIONROCKSTAR.ONLINE home"><img src="/assets/images/fahionrockstar-logo-white.png" alt=""></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
      <a href="/work/">Work</a><a href="/services/">Services</a><a href="/issue-01/">Issue 01</a><a class="is-active" aria-current="page" href="/book/">INQUIRIES</a><a href="/about/">PROFILE</a><a href="/contact/">Contact</a>
    </nav>
  </header>

  <main class="page-shell book-page">
    <h1 class="page-title">PROJECT INQUIRIES</h1>
    <form class="booking-form" name="booking" method="post" data-netlify="true">
      <input type="hidden" name="form-name" value="booking">
      <label><span>Name</span><input type="text" name="name" autocomplete="name" required></label>
      <label><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
      <label><span>Type of project</span><select id="project-type" name="project-type" required><option value="" selected disabled>Select</option><option value="creative-direction">Creative Direction</option><option value="photography">Visuals (Photo &amp; Video)</option><option value="styling">Styling</option><option value="beauty">Beauty</option></select></label>
      <label class="booking-form__details"><span>Project details</span><textarea name="project-details" rows="5" required></textarea></label>
      <button type="submit"><span>SEND INQUIRY</span></button>
      <p class="booking-form__status" id="booking-status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" hidden></p>
    </form>
  </main>
</body>
</html>
