  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="FASHIONROCKSTAR.ONLINE — creative direction, photography, videography, styling and beauty in Montreal.">
  <title>FASHIONROCKSTAR — Fragment entrance preview</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/landing.css">
  <link rel="stylesheet" href="./entry.css">
  <script>
    (() => {
      let show = true;
      try { show = new URL(location.href).searchParams.get('replay') === '1' || sessionStorage.getItem('frsrFragmentEntryV1') !== 'seen'; } catch {}
      if (!show) return;
      document.documentElement.classList.add('fragment-entry-open');
      window.__frsrEntryFailOpen = setTimeout(() => {
        document.documentElement.classList.remove('fragment-entry-open');
        document.querySelector('[data-fragment-entry]')?.setAttribute('hidden', '');
        document.querySelectorAll('main, footer').forEach(el => { el.inert = false; });
      }, 8000);
    })();
  </script>
  <noscript><style>.home .hero__brand .hero__fallback { visibility: visible; }</style></noscript>
  <script src="./entry.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/landing.js" defer></script>

  <section class="fragment-entry" data-fragment-entry data-state="idle" role="dialog" aria-modal="true" aria-label="Enter FASHIONROCKSTAR" hidden>
    <canvas class="fragment-entry__canvas" data-entry-canvas aria-hidden="true"></canvas>
    <div class="fragment-entry__invitation" data-entry-invitation>
      <img src="/assets/images/hero-logo-white.png" width="728" height="97" alt="FASHIONROCKSTAR.ONLINE">
      <button type="button" class="entry-enter" data-entry-enter>ENTER<span aria-hidden="true">↗</span></button>
    </div>
    <p class="fragment-entry__caption" data-entry-caption aria-live="polite"></p>
    <button type="button" class="entry-skip" data-entry-skip>SKIP</button>
    <video data-entry-film muted playsinline preload="auto" hidden src="./silhouette.mp4"></video>
  </section>
  <audio data-entry-voice preload="none" src="/assets/audio/FASHIONROCKSTAR_ACCESS_GRANTED.mp3"></audio>
  <div class="entry-review" data-entry-review hidden>
