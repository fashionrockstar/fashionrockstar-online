<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Homepage entrance — responsive verification</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#202020;color:white;font:14px system-ui}h1{font-size:20px;margin:0 0 16px}button{font:inherit;background:#fff;color:#111;border:0;padding:12px 16px;cursor:pointer;margin:0 8px 8px 0}main{display:flex;gap:24px;align-items:flex-start;margin-top:16px}iframe{border:0;flex:none;background:#000;width:390px;height:844px}pre{white-space:pre-wrap;max-width:420px;font-size:13px;line-height:1.6}p{max-width:600px;line-height:1.5}
</style>
<h1>Homepage entrance — responsive verification</h1>
<button data-size="390,844">390 × 844</button><button data-size="430,932">430 × 932</button><button data-size="844,390">844 × 390</button>
<button id="start">Start fresh visit</button><button id="return">Return home</button>
<p>Uses the actual homepage inside a phone-sized viewport. This checks responsive layout and playback timing in this browser; it does not emulate iOS or Safari.</p>
<main><iframe title="Phone-sized homepage" allow="autoplay" src="about:blank"></iframe><pre id="report">Choose Start fresh visit.</pre></main>
<script>
const frame=document.querySelector('iframe'),report=document.querySelector('#report');
let samples=[],active=false,started=0,mode='fresh',previousDocument=null;
document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{const [w,h]=b.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';}));
const start=fresh=>{previousDocument=frame.contentDocument;report.textContent='Loading homepage…';if(fresh)sessionStorage.removeItem('frsrSimpleEntryV1');samples=[];active=true;started=performance.now();mode=fresh?'fresh':'return';frame.src='/';};
document.querySelector('#start').onclick=()=>start(true);document.querySelector('#return').onclick=()=>start(false);
setInterval(()=>{
 if(!active)return;
 const d=frame.contentDocument;if(!d||d===previousDocument||!d.querySelector('[data-entry-loader]'))return;
 const video=d.querySelector('[data-hero-video]'),loader=d.querySelector('[data-entry-loader]'),box=video.getBoundingClientRect();
 const loading=d.documentElement.classList.contains('entry-loading');
 const sample={elapsed:(performance.now()-started)/1000,loading,time:video.currentTime,paused:video.paused};samples.push(sample);
 const during=samples.filter(s=>s.loading),after=samples.filter(s=>!s.loading);
 const x=parseFloat(loader.style.getPropertyValue('--entry-mark-left')),y=parseFloat(loader.style.getPropertyValue('--entry-mark-top')),w=parseFloat(loader.style.getPropertyValue('--entry-mark-width'));
 const current={visit:mode,viewport:[frame.clientWidth,frame.clientHeight],loaderObserved:during.length>0,loaderSeconds:during.length?(during[during.length-1].elapsed-during[0].elapsed).toFixed(1):null,playedBehindLoader:during.some(s=>s.time>.05),firstVisibleVideoTime:after[0]?.time,homepagePlaying:!video.paused,homepageTime:video.currentTime,inlinePlayback:video.playsInline,muted:video.muted,horizontalOverflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,alignmentError:{x:Number.isFinite(x)?Math.abs(x-box.left-box.width/2):null,y:Number.isFinite(y)?Math.abs(y-box.top-box.height/2):null,width:Number.isFinite(w)?Math.abs(w-2688*Math.min(box.width/3840,box.height/2160)):null}};
 report.textContent=JSON.stringify(current,null,2);
},100);
</script>
</html>
